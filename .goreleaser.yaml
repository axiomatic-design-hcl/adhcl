version: 2

project_name: adhcl

builds:
  - id: adhcl
    main: ./cmd/adhcl
    binary: adhcl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.buildVersion={{ .Tag }}

archives:
  - id: default
    ids:
      - adhcl
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  github:
    owner: axiomatic-design-hcl
    name: adhcl
